<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<!-- Social share image (Open Graph / Twitter), 1200x630. Rendered by render.js. -->
<style>
  @font-face { font-family:'Bebas Neue'; font-weight:400; src:url(../../assets/fonts/bebas-neue-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family:'DM Sans'; font-weight:100 1000; src:url(../../assets/fonts/dm-sans-latin-wght-normal.woff2) format('woff2'); }
</style>
<style>
  :root { --pitch-black:#0A0A0A; --warm-white:#F5F3EE; --blaze-orange:#FF5E1A; --orange-light:#FF8050; --orange-dark:#CC4C16; }
  html, body { margin:0; background:var(--pitch-black); overflow:hidden; }
  .stage { position:relative; width:1200px; height:630px; }
  canvas { position:absolute; inset:0; width:1200px; height:630px; }
  /* Site-header standard: Pitch Black gradient on the copy side, topo alive on the far side */
  .overlay { position:absolute; inset:0; background:linear-gradient(110deg, rgba(10,10,10,0.90) 0%, rgba(10,10,10,0.72) 42%, rgba(10,10,10,0.10) 100%); }
  .copy { position:absolute; inset:0; padding:64px 72px; display:flex; flex-direction:column; color:var(--warm-white); }
  .mark { height:44px; width:auto; display:block; align-self:flex-start; margin-bottom:28px; }
  .eyebrow { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.22em; color:var(--blaze-orange); margin-top:auto; }
  .title { font-family:'Bebas Neue',sans-serif; font-size:112px; line-height:0.92; letter-spacing:0.02em; max-width:1000px; margin-top:14px; text-wrap:balance; }
  .sub { font-family:'DM Sans',sans-serif; font-weight:400; font-size:26px; line-height:1.4; color:rgba(245,243,238,0.82); margin-top:24px; max-width:32em; text-wrap:balance;
         display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sub:empty { display:none; }
  .copy > * { flex-shrink:0; }   /* never squash a line: the title steps down instead */
  /* Topic chips, in each topic's own hue (hub.css .t-<key>) */
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; }
  .chips:empty { display:none; }
  .chip { display:inline-flex; align-items:center; gap:10px; padding:8px 14px; border-radius:2px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:19px; color:var(--warm-white);
          border:1px solid color-mix(in srgb, var(--t) 45%, transparent); background:color-mix(in srgb, var(--t) 14%, rgba(10,10,10,0.6)); }
  .chip i { width:10px; height:10px; background:var(--t); display:block; }
  .url { font-family:'DM Sans',sans-serif; font-weight:500; font-size:18px; letter-spacing:0.08em; color:rgba(245,243,238,0.55); margin-top:32px; }
</style></head>
<body><div class="stage">
  <canvas id="topo"></canvas>
  <div class="overlay"></div>
  <div class="copy">
    <img class="mark" src="../../assets/img/dn-mark-white.svg" alt="">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
    <div class="chips" id="chips"></div>
    <div class="url" id="url"></div>
  </div>
</div>
<script src="../../assets/js/topo-motion.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  for (const k of ['eyebrow', 'title', 'sub', 'url']) document.getElementById(k).textContent = q.get(k) || '';
  // chips: JSON [{label, color}]
  const chips = document.getElementById('chips');
  for (const c of JSON.parse(q.get('chips') || '[]')) {
    const el = document.createElement('span'); el.className = 'chip'; el.style.setProperty('--t', c.color);
    el.innerHTML = '<i></i>'; el.append(c.label); chips.append(el);
  }
  TopoMotion.create(document.getElementById('topo'), {
    static: true, seed: +q.get('seed'), width: 1200, height: 630, dpr: 1, background: '#0A0A0A',
  });
  // Long titles step down until the copy fits the card
  document.fonts.ready.then(() => {
    const t = document.getElementById('title'), copy = document.querySelector('.copy');
    let size = 112;
    while (size > 56 && (t.offsetHeight > size * 0.92 * 2.05 || copy.scrollHeight > 630)) { size -= 4; t.style.fontSize = size + 'px'; }
    document.body.dataset.ready = '1';
  });
</script>
</body></html>
