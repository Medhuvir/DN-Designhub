# Eleventy pre-renders the site into _site (see eleventy.config.mjs).
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Internal files live in the repo but aren't part of the site. Only _site is
# published, so they aren't there anyway; these rules keep it that way if a
# passthrough copy ever widens. CLAUDE.md holds working notes; tools/ is
# build-time tooling.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
